<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Pregunta</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6F42}a:hover{color:#0F3D26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F2; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; color: #18241D; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 8px">
<button type="button" aria-label="Sortir de l'examen" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(15, 61, 38, 0.06), 0 8px 24px rgba(15, 61, 38, 0.07)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="#0F3D26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="flex: 1 1 auto; display: flex; gap: 6px" aria-label="Pregunta 2 de 5"><div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #1D6F42"></div><div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #1D6F42"></div><div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #CFDCD3"></div><div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #CFDCD3"></div><div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #CFDCD3"></div></div>
<div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; background: #E4F0E8; font-size: 16px; font-weight: 700; color: #0F3D26"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#0F3D26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9.5 2.5h5"></path></svg>4:12</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 24px; flex: 1 1 auto">
<span style="font-size: 15px; font-weight: 700; color: #1D6F42">Pregunta 2 de 5</span>
<h1 style="margin: 0; font-size: 25px; line-height: 1.25; color: #18241D">[Mostra] Quines d'aquestes situacions acaben amb un tir lliure?</h1>
<div style="align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; background: #FFF4CC; font-size: 15px; font-weight: 700; color: #3D2E00"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#3D2E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="2"></rect><rect x="3" y="13" width="7" height="7" rx="2"></rect><path d="M14 7.5h7M14 16.5h7"></path></svg>Pots marcar més d'una</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 4px">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{ o.toggle }}" aria-pressed="{{ o.pressed }}" style="{{ o.style }}">
<span style="{{ o.boxStyle }}"><sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="font-size: 17px; line-height: 1.35; text-align: left">{{ o.label }}</span>
</button>
</sc-for>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: 1.5px solid #B9C9BE; background: #FFFFFF; color: #0F3D26; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#0F3D26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Anterior</button>
<button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: none; background: #0F3D26; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; width: 167px">Següent<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const labels = ['[Mostra] Tocar la pilota amb la mà', '[Mostra] Moure un botó fora de torn', '[Mostra] Xutar sense avisar el porter', '[Mostra] Cap de les anteriors'];
const picked = (this.state && this.state.picked) || { 1: true };
const options = labels.map((label, i) => {
  const on = !!picked[i];
  return {
    label, on, pressed: on ? 'true' : 'false',
    toggle: () => this.setState({ picked: Object.assign({}, picked, { [i]: !on }) }),
    style: 'display: flex; align-items: center; gap: 14px; min-height: 64px; width: 100%; box-sizing: border-box; padding: 14px 18px; border-radius: 18px; font-family: inherit; color: #18241D; cursor: pointer; ' + (on ? 'border: 2px solid #1D6F42; background: #EAF4EE' : 'border: 2px solid transparent; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15, 61, 38, 0.06), 0 6px 18px rgba(15, 61, 38, 0.06)'),
    boxStyle: 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (on ? 'background: #1D6F42' : 'border: 2px solid #8AA394'),
  };
});
return { options };
}
}
</script>
</body>
</html>
